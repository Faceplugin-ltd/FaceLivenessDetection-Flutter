name: face_liveness_sdk
description: FacePlugin Face Liveness Detection SDK for Flutter — on-device passive anti-spoofing and guided active liveness.
version: 0.2.0
homepage: https://faceplugin.com
repository: https://github.com/Faceplugin-ltd/FaceLivenessDetection-Flutter

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.faceplugin.face_liveness_sdk
        pluginClass: FaceLivenessSdkPlugin
      ios:
        pluginClass: FaceLivenessSdkPlugin
