name: face_liveness_sdk_example
description: FacePlugin Face Liveness demo for Flutter.
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  face_liveness_sdk:
    path: ../
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fp_logo.png
  config:
    # CocoaPods hosts the engine frameworks; SPM is not wired for this plugin.
    enable-swift-package-manager: false

